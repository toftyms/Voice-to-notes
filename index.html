<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14212B">
<title>Voice Notes</title>
<style>
  :root{
    --paper:#EEF1F4; --card:#FFFFFF; --ink:#14212B; --muted:#5B6B78;
    --line:#D3DAE0; --teal:#0F6E6E; --teal-dark:#0B5252; --rec:#C8372D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  button:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

  header{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--ink);color:#fff;padding-top:max(12px,env(safe-area-inset-top))}
  header h1{font-size:19px;font-weight:600;margin:0;flex:1}
  .hbtn{padding:9px 13px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:15px}
  .hbtn:active{background:rgba(255,255,255,.25)}

  main{flex:1;min-height:0;display:flex;flex-direction:column}
  .view{display:none;flex:1;min-height:0;flex-direction:column}
  .view.on{display:flex}

  /* setup / status */
  #setup{margin:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:none}
  #setup.on{display:block}
  #setup p{margin:0 0 12px;line-height:1.45}
  .primary{background:var(--teal);color:#fff;padding:13px 18px;border-radius:12px;font-weight:600;width:100%;font-size:16px}
  .primary:active{background:var(--teal-dark)}
  .primary:disabled{opacity:.6}
  progress{width:100%;height:10px;margin-top:12px;display:none}
  #msg{margin:10px 14px 0;color:var(--muted);font-size:14px;min-height:1.2em}
  #msg.err{color:var(--rec)}

  /* list */
  #notes{flex:1;overflow:auto;padding:12px 14px 110px;margin:0;list-style:none}
  #notes li{margin-bottom:10px}
  .item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .item b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item small{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;margin-top:60px;line-height:1.5;padding:0 30px}
  .fab{position:fixed;right:18px;bottom:max(22px,env(safe-area-inset-bottom));padding:15px 22px;border-radius:30px;background:var(--teal);color:#fff;font-weight:600;font-size:16px;box-shadow:0 4px 14px rgba(20,33,43,.3)}

  /* editor */
  .tools{display:flex;gap:8px;padding:10px 14px 0}
  .tools button{flex:1;padding:10px 6px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px}
  .tools .del{color:var(--rec)}
  #ed{flex:1;min-height:0;margin:10px 14px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.6;color:var(--ink);resize:none;width:auto}
  #live{margin:8px 14px 0;min-height:26px;color:var(--muted);font-style:italic;font-size:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .dock{display:flex;flex-direction:column;align-items:center;padding:6px 0 max(14px,env(safe-area-inset-bottom))}
  #mic{width:84px;height:84px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 0 rgba(200,55,45,.5)}
  #mic svg{width:36px;height:36px;fill:currentColor}
  #mic:disabled{opacity:.5}
  #mic.rec{background:var(--rec);animation:ring 1.4s ease-out infinite}
  @keyframes ring{to{box-shadow:0 0 0 22px rgba(200,55,45,0)}}
  @media (prefers-reduced-motion:reduce){#mic.rec{animation:none;box-shadow:0 0 0 8px rgba(200,55,45,.3)}}
  #micLabel{margin-top:6px;font-size:14px;color:var(--muted)}
  .tip{margin:0 14px 6px;font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="back" style="display:none" aria-label="Back to notes">&larr; Notes</button>
  <h1 id="title">Voice Notes</h1>
</header>

<main>
  <div id="setup">
    <p><b>One-time setup.</b> Download the speech model (about 40 MB) while you have internet. After that, voice typing works with no connection at all.</p>
    <button class="primary" id="dl">Download speech model</button>
    <progress id="prog" max="100" value="0"></progress>
  </div>
  <div id="msg"></div>

  <section class="view on" id="vList">
    <ul id="notes"></ul>
    <button class="fab" id="newNote">+ New note</button>
  </section>

  <section class="view" id="vEdit">
    <div class="tools">
      <button id="copy">Copy</button>
      <button id="share">Share</button>
      <button id="save">Save .txt</button>
      <button id="del" class="del">Delete</button>
    </div>
    <textarea id="ed" placeholder="Tap the mic and start talking. You can also type or fix words here." aria-label="Note text"></textarea>
    <div id="live" aria-live="polite"></div>
    <div class="tip">Say &ldquo;full stop&rdquo;, &ldquo;comma&rdquo;, &ldquo;question mark&rdquo; or &ldquo;new line&rdquo; to add them.</div>
    <div class="dock">
      <button id="mic" aria-label="Start dictation" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2z"/></svg>
      </button>
      <div id="micLabel">Getting ready&hellip;</div>
    </div>
  </section>
</main>

<script>
(() => {
  const VOSK_URL  = "https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js";
  const MODEL_URL = "https://ccoreilly.github.io/vosk-browser/models/vosk-model-small-en-us-0.15.tar.gz";
  const $ = id => document.getElementById(id);

  /* ---------- tiny IndexedDB store for the downloaded files ---------- */
  const idb = {
    db: null,
    open(){
      return new Promise((res, rej) => {
        if (this.db) return res(this.db);
        const r = indexedDB.open("voice-notes-assets", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("files");
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      });
    },
    async get(k){
      const db = await this.open();
      return new Promise((res, rej) => {
        const q = db.transaction("files").objectStore("files").get(k);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    },
    async set(k, v){
      const db = await this.open();
      return new Promise((res, rej) => {
        const t = db.transaction("files", "readwrite");
        t.objectStore("files").put(v, k);
        t.oncomplete = () => res(); t.onerror = () => rej(t.error);
      });
    }
  };

  /* ---------- notes storage ---------- */
  let notes = [];
  try { notes = JSON.parse(localStorage.getItem("vn-notes") || "[]"); } catch(_) {}
  let current = null; // note object being edited
  const persist = () => { try { localStorage.setItem("vn-notes", JSON.stringify(notes)); } catch(_) { say("Could not save: phone storage may be full.", true); } };
  const noteTitle = n => (n.text.trim().split("\n")[0] || "Empty note").slice(0, 60);
  const fmtDate = t => new Date(t).toLocaleString([], {day:"numeric", month:"short", hour:"numeric", minute:"2-digit"});

  function say(text, err){ const m = $("msg"); m.textContent = text || ""; m.className = err ? "err" : ""; }

  function renderList(){
    const ul = $("notes"); ul.innerHTML = "";
    if (!notes.length){
      ul.innerHTML = '<li class="empty">No notes yet.<br>Tap &ldquo;New note&rdquo; and start talking.</li>';
      return;
    }
    [...notes].sort((a,b) => b.updated - a.updated).forEach(n => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.className = "item";
      b.innerHTML = "<b></b><small></small>";
      b.firstChild.textContent = noteTitle(n);
      b.lastChild.textContent = fmtDate(n.updated);
      b.onclick = () => openNote(n);
      li.appendChild(b); ul.appendChild(li);
    });
  }

  function show(view){
    $("vList").classList.toggle("on", view === "list");
    $("vEdit").classList.toggle("on", view === "edit");
    $("back").style.display = view === "edit" ? "" : "none";
    $("title").textContent = view === "edit" ? "Note" : "Voice Notes";
  }

  function openNote(n){
    current = n; $("ed").value = n.text; $("live").textContent = ""; show("edit");
  }
  function newNote(){
    const n = { id: Date.now(), text: "", updated: Date.now() };
    notes.push(n); persist(); openNote(n);
  }
  function saveCurrent(){
    if (!current) return;
    current.text = $("ed").value; current.updated = Date.now(); persist();
  }
  let t = null;
  $("ed").addEventListener("input", () => { clearTimeout(t); t = setTimeout(saveCurrent, 400); });

  async function leaveNote(){
    if (recording || stopping) await stopRec();
    saveCurrent();
    if (current && !current.text.trim()) notes = notes.filter(n => n !== current);
    persist(); current = null; renderList(); show("list");
  }

  $("newNote").onclick = newNote;
  $("back").onclick = leaveNote;
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText($("ed").value); say("Copied."); }
    catch(_) { $("ed").select(); document.execCommand("copy"); say("Copied."); }
  };
  $("share").onclick = async () => {
    const text = $("ed").value;
    if (navigator.share) { try { await navigator.share({ text }); } catch(_) {} }
    else { say("Sharing isn't available here. Use Copy or Save .txt.", true); }
  };
  $("save").onclick = () => {
    const blob = new Blob([$("ed").value], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (noteTitle(current).replace(/[^\w\- ]+/g, "").trim() || "note") + ".txt";
    document.body.appendChild(a); a.click(); a.remove();
  };
  $("del").onclick = async () => {
    if (!confirm("Delete this note?")) return;
    if (recording || stopping) await stopRec();
    notes = notes.filter(n => n !== current); persist(); current = null; renderList(); show("list");
  };

  /* ---------- speech model: download once, then load from phone storage ---------- */
  let model = null, loading = null;

  async function download(url, key, label){
    let blob = await idb.get(key);
    if (blob) return blob;
    say("Downloading " + label + "…");
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("Download failed (" + resp.status + ")");
    const total = +resp.headers.get("content-length") || 0;
    const reader = resp.body.getReader(); const chunks = []; let got = 0;
    const p = $("prog"); p.style.display = "block";
    for (;;){
      const {done, value} = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      if (total) p.value = Math.round(got / total * 100);
      else p.removeAttribute("value");
    }
    blob = new Blob(chunks);
    await idb.set(key, blob);
    return blob;
  }

  function loadScript(blob){
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = URL.createObjectURL(new Blob([blob], { type: "text/javascript" }));
      s.onload = res; s.onerror = () => rej(new Error("Could not start the speech engine."));
      document.head.appendChild(s);
    });
  }

  async function cached(){
    try { return !!(await idb.get("model")) && !!(await idb.get("vosk")); } catch(_) { return false; }
  }

  function loadModel(){
    if (loading) return loading;
    loading = (async () => {
      try {
        const vosk = await download(VOSK_URL, "vosk", "speech engine");
        const mod = await download(MODEL_URL, "model", "speech model");
        $("prog").style.display = "none";
        say("Loading the speech model…");
        if (!window.Vosk) await loadScript(vosk);
        model = await Promise.race([
          Vosk.createModel(URL.createObjectURL(mod)),
          new Promise((_, rej) => setTimeout(() => rej(new Error("The speech model didn't start. Open this app from its web address (https), not from a downloaded file.")), 120000))
        ]);
        $("setup").classList.remove("on");
        say("");
        setReady();
      } catch (e) {
        loading = null;
        $("prog").style.display = "none";
        $("dl").disabled = false;
        const offline = !navigator.onLine;
        say(offline ? "No internet. Connect once to download the model." : (e.message || "Something went wrong."), true);
        $("setup").classList.add("on");
        $("micLabel").textContent = "Not ready";
      }
    })();
    return loading;
  }

  function setReady(){
    $("mic").disabled = false;
    $("micLabel").textContent = "Tap to talk";
  }

  $("dl").onclick = () => { $("dl").disabled = true; loadModel(); };

  /* ---------- dictation ---------- */
  let recording = false, ctx, stream, proc, src, rec, wake, stopping = null, stats = { sent: 0, got: 0 }, chunkSec = 0.256;

  function formatSpoken(s){
    return s
      .replace(/\bfull stop\b/g, ".")
      .replace(/\bcomma\b/g, ",")
      .replace(/\bquestion mark\b/g, "?")
      .replace(/\b(new line|next line)\b/g, "\n")
      .replace(/[ ]+([.,?])/g, "$1");
  }

  function append(raw){
    let s = formatSpoken(raw).trim();
    if (!s) return;
    const ed = $("ed"), cur = ed.value;
    const startsSentence = !cur.trim() || /[.?!]\s*$/.test(cur) || cur.endsWith("\n");
    if (startsSentence) s = s.charAt(0).toUpperCase() + s.slice(1);
    const glue = (!cur || cur.endsWith("\n") || /^[.,?]/.test(s)) ? "" : " ";
    ed.value = cur + glue + s;
    ed.scrollTop = ed.scrollHeight;
    saveCurrent();
  }

  async function startRec(){
    if (recording || stopping) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      say("The microphone isn't available on this page. Open the app from a secure (https) address instead of a file.", true);
      return;
    }
    try {
      if (!model) await loadModel();
      if (!model) return;
      stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
    } catch (e) {
      say("Microphone blocked. Allow the microphone for this page in Chrome's site settings, then try again.", true);
      return;
    }
    say("");
    const st = stats = { sent: 0, got: 0, finalizing: false, done: null };
    const AC = window.AudioContext || window.webkitAudioContext;
    try {
      ctx = new AC({ sampleRate: 16000 });
      src = ctx.createMediaStreamSource(stream);
    } catch(_) {
      try { if (ctx) ctx.close(); } catch(__) {}
      ctx = new AC();
      src = ctx.createMediaStreamSource(stream);
    }
    try { await ctx.resume(); } catch(_) {}
    rec = new model.KaldiRecognizer(ctx.sampleRate);
    chunkSec = 4096 / ctx.sampleRate;
    const check = () => { if (st.finalizing && st.got > st.sent && st.done) st.done(); };
    rec.on("error", m => say("Speech error: " + (m.error || "unknown"), true));
    rec.on("result", m => {
      st.got++;
      const x = m.result && m.result.text; if (x) append(x);
      $("live").textContent = "";
      check();
    });
    rec.on("partialresult", m => {
      st.got++;
      const p = (m.result && m.result.partial) || "";
      $("live").textContent = p.length > 60 ? "\u2026" + p.slice(-60) : p;
      check();
    });
    proc = ctx.createScriptProcessor(4096, 1, 1);
    let hang = 0, tick = 0;
    proc.onaudioprocess = e => {
      if (!recording) return;
      const d = e.inputBuffer.getChannelData(0);
      let sum = 0;
      for (let i = 0; i < d.length; i++) sum += d[i] * d[i];
      const rms = Math.sqrt(sum / d.length);
      // only send audio while someone is speaking (plus a short tail so sentences end cleanly)
      if (rms > 0.008) hang = 5;
      if (hang > 0) {
        hang--;
        try { rec.acceptWaveform(e.inputBuffer); st.sent++; } catch(err) { say("Audio error: " + err.message, true); }
      }
      if (++tick % 3 === 0) {
        const behind = Math.max(0, st.sent - st.got) * chunkSec;
        $("micLabel").textContent = "Listening… " + "\u25AE".repeat(Math.min(12, Math.round(rms * 80))) +
          (behind > 3 ? "  \u00B7 catching up: " + Math.round(behind) + "s" : "");
      }
    };
    recording = true;
    src.connect(proc); proc.connect(ctx.destination);
    try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch(_) {}
    $("mic").classList.add("rec");
    $("mic").setAttribute("aria-label", "Stop dictation");
    $("micLabel").textContent = "Listening… tap to stop";
  }

  function stopRec(){
    if (stopping) return stopping;
    if (!recording) return Promise.resolve();
    stopping = doStop().finally(() => { stopping = null; });
    return stopping;
  }

  async function doStop(){
    const st = stats;
    recording = false;
    $("mic").classList.remove("rec");
    $("mic").disabled = true;
    try { proc.disconnect(); src.disconnect(); } catch(_) {}
    try { stream.getTracks().forEach(tr => tr.stop()); } catch(_) {}
    try { await ctx.close(); } catch(_) {}
    const waitDone = new Promise(res => { st.done = res; });
    st.finalizing = true;
    try { rec.retrieveFinalResult(); } catch(_) { st.done(); }
    const tm = setInterval(() => {
      const left = Math.max(0, st.sent - st.got) * chunkSec;
      $("micLabel").textContent = left > 1 ? "Finishing… " + Math.round(left) + "s of speech left" : "Finishing…";
    }, 500);
    await Promise.race([waitDone, new Promise(r => setTimeout(r, 240000))]);
    clearInterval(tm);
    try { rec.remove(); } catch(_) {}
    try { if (wake) { await wake.release(); wake = null; } } catch(_) {}
    $("live").textContent = "";
    saveCurrent();
    $("mic").disabled = false;
    $("mic").setAttribute("aria-label", "Start dictation");
    $("micLabel").textContent = "Tap to talk";
  }

  $("mic").onclick = () => recording ? stopRec() : startRec();
  document.addEventListener("visibilitychange", () => { if (document.hidden && recording) stopRec(); });

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  /* ---------- start ---------- */
  renderList();
  (async () => {
    if (await cached()) { loadModel(); }
    else { $("setup").classList.add("on"); $("micLabel").textContent = "Download the model first"; }
  })();
})();
</script>
</body>
</html>
